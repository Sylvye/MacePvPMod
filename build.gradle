plugins { id 'net.fabricmc.fabric-loom' version '1.17.20' }
version = '1.0.0'
group = 'dev.sylvyespvphud'
repositories { mavenCentral(); maven { url = 'https://maven.terraformersmc.com/releases/' } }
dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    implementation 'net.fabricmc:fabric-loader:0.19.3'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.158.0+26.2'
    compileOnly 'com.terraformersmc:modmenu:20.0.1'
    if (!project.hasProperty('withoutModMenu')) runtimeOnly 'com.terraformersmc:modmenu:20.0.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }
test { useJUnitPlatform() }
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'sylvyespvphud-test'
        enableGameTests = false
        enableClientGameTests = true
    }
}

// Keep feature verification focused when running client checks locally.
tasks.named('processGametestResources') {
    def combatTests = providers.gradleProperty('combatTests').isPresent()
    def reachOutlineTests = providers.gradleProperty('reachOutlineTests').isPresent()
    inputs.property('combatTests', combatTests)
    inputs.property('reachOutlineTests', reachOutlineTests)
    if (combatTests || reachOutlineTests) filesMatching('fabric.mod.json') {
        filter { line ->
            def json = new groovy.json.JsonSlurper().parseText(line)
            json.entrypoints['fabric-client-gametest'] = json.entrypoints['fabric-client-gametest'].findAll {
                reachOutlineTests ? it.endsWith('ReachOutlinesSmokeTest') :
                        it.endsWith('HudSmokeTest') || it.endsWith('ShieldDamageSmokeTest') || it.endsWith('ShieldDurabilitySmokeTest') || it.endsWith('SustainedCombatSmokeTest')
            }
            groovy.json.JsonOutput.toJson(json)
        }
    }
}
